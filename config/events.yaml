# events.yaml — high-impact scheduled US macro events (human-maintained; RISK.md R-021).
# Used for: entry blackouts (risk.yaml event_blackout_*), the `event_day` regime tag, and LLM context packs.
# Claude Code drafts entries in task P1.8 from official sources; the HUMAN verifies every date/time.
# `trader doctor` warns when there are no events in the next 14 days.
#
# Official sources:
#   FOMC meetings & statements: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm  (decision 14:00 ET)
#   CPI, Employment Situation (jobs), PPI: https://www.bls.gov/schedule/  (08:30 ET)
#   GDP, PCE: https://www.bea.gov/news/schedule  (08:30 ET)
#
# Format (times in America/New_York):
# - date: 2026-12-09
#   time: "14:00"
#   name: FOMC rate decision
#   impact: high          # high | medium (only `high` triggers blackouts by default)
#   source: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
#   verified_by_human: false
#
# Draft of 2026-10-09 (P1.8), covering 2026-10-09 .. 2027-01-09. Every entry is unverified
# until the human checks it against the source and sets verified_by_human: true.
#   - The 14:30 FOMC press conferences are listed as high impact by the human's choice (blackout
#     14:25-14:40 on top of 13:55-14:10 around the statement).
#   - FOMC minutes are medium: recorded for context, no blackout.
#   - The 08:30 BLS releases come before the open, so they never block entries; they set the
#     event_day tag and feed the context packs.
#   - Federal funding runs through 2026-12-11 (H.R. 6500). If it lapses, BLS reschedules or
#     cancels releases (as in the 2025 shutdown): re-check the January dates in December.

